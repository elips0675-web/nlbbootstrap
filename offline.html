<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0b1220">
    <meta name="robots" content="noindex">
    <title>Нет подключения — Библиотека 2026</title>
    <style>
        :root {
            --nlb-primary: #2563eb;
            --nlb-primary-dark: #1d4ed8;
            --nlb-ink: #0b1220;
            --nlb-muted: #64748b;
            --nlb-line: #e2e8f0;
            --nlb-grad: linear-gradient(135deg, #2563eb 0%, #7c3aed 100%);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 1.5rem;
            background: #f8fafc;
            color: var(--nlb-ink);
            font-family: "Manrope", "Segoe UI", system-ui, -apple-system, sans-serif;
            line-height: 1.6;
        }

        .card {
            width: 100%;
            max-width: 34rem;
            padding: 2.5rem 2rem;
            border: 1px solid var(--nlb-line);
            border-radius: 1.5rem;
            background: #fff;
            box-shadow: 0 24px 60px -32px rgba(15, 23, 42, 0.35);
            text-align: center;
        }

        .mark {
            width: 72px;
            height: 72px;
            margin: 0 auto 1.25rem;
            border-radius: 1.25rem;
            background-image: var(--nlb-grad);
            display: grid;
            place-items: center;
            color: #fff;
        }

        h1 {
            margin: 0 0 0.75rem;
            font-size: clamp(1.4rem, 4vw, 1.85rem);
            line-height: 1.25;
        }

        p {
            margin: 0 0 1rem;
            color: var(--nlb-muted);
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.75rem;
            margin-top: 1.5rem;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 44px;
            padding: 0 1.25rem;
            border: 1px solid transparent;
            border-radius: 0.75rem;
            font: inherit;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn--primary {
            background-image: var(--nlb-grad);
            color: #fff;
            box-shadow: 0 16px 32px -16px rgba(37, 99, 235, 0.8);
        }

        .btn--ghost {
            border-color: var(--nlb-line);
            background: #fff;
            color: var(--nlb-ink);
        }

        .btn:hover { transform: translateY(-1px); }

        .hint {
            margin-top: 1.5rem;
            font-size: 0.85rem;
            color: var(--nlb-muted);
        }

        @media (prefers-reduced-motion: reduce) {
            .btn { transition: none; }
        }
    </style>
</head>
<body>
    <main class="card">
        <span class="mark" aria-hidden="true">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 7v14"/>
                <path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3Z"/>
            </svg>
        </span>

        <h1>Нет подключения к интернету</h1>
        <p>
            Страница не загрузилась, потому что устройство офлайн.
            Проверьте сеть и попробуйте снова — открытые ранее разделы
            останутся доступны.
        </p>

        <div class="actions">
            <button class="btn btn--primary" type="button" onclick="location.reload()">Обновить</button>
            <a class="btn btn--ghost" href="/">На главную</a>
        </div>

        <p class="hint">
            Библиотека 2026 · пр. Независимости, 116 · +375 (17) 300-00-00
        </p>
    </main>
</body>
</html>
