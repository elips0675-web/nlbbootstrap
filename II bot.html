<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Чат — NLBBootstrap Events</title>
<style>
  :root{
    --brand:#1f6fff;
    --brand-light:#3aa0ff;
    --ink:#1f2d3d;
    --muted:#8492a6;
    --line:#e6e9ef;
    --bg:#f7f9fc;
    --green:#28d07a;
    --human-accent:#ff6b6b; /* Цвет для живого оператора */
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
    color:var(--ink);
    background: radial-gradient(1000px 500px at 80% -10%, #dbeaff 0%, transparent 60%),
                radial-gradient(800px 400px at 0% 100%, #e6f3ff 0%, transparent 55%),
                #f4f7fc;
    min-height:100vh;
  }
  .demo{ max-width:720px; margin:0 auto; padding:80px 24px; text-align:center; }
  .demo h1{ font-size:28px; margin:0 0 12px; letter-spacing:-.02em; }
  .demo p{ color:#63728a; line-height:1.6; margin:0; }
  .demo .hint{
    display:inline-flex; align-items:center; gap:8px; margin-top:28px;
    background:#fff; border:1px solid var(--line); border-radius:999px;
    padding:10px 18px; font-size:14px; color:#4a5a72;
    box-shadow:0 6px 20px rgba(20,50,100,.06);
  }
  .demo .hint b{ color:var(--brand); }

  /* ---------- Launcher ---------- */
  .launcher{
    position:fixed; right:24px; bottom:24px; width:60px; height:60px; border-radius:50%;
    border:0; cursor:pointer; color:#fff; z-index:999;
    background:linear-gradient(135deg,var(--brand-light),var(--brand));
    box-shadow:0 12px 30px rgba(31,111,255,.42);
    display:grid; place-items:center;
    transition:transform .18s ease, box-shadow .18s ease;
  }
  .launcher:hover{ transform:translateY(-2px) scale(1.05); box-shadow:0 16px 36px rgba(31,111,255,.5); }
  .launcher svg{ width:28px; height:28px; display:block; }
  .launcher .icon-close{ display:none; }
  .launcher.active .icon-chat{ display:none; }
  .launcher.active .icon-close{ display:block; }

  /* ---------- Chat panel ---------- */
  .chat{
    position:fixed; right:24px; bottom:96px;
    width:380px; height:min(620px,calc(100vh - 130px));
    background:#fff; border-radius:18px; border:1px solid rgba(15,40,80,.06);
    box-shadow:0 24px 60px rgba(15,40,80,.22),0 2px 8px rgba(15,40,80,.08);
    display:flex; flex-direction:column; overflow:hidden; z-index:1000;
    opacity:0; transform:translateY(14px) scale(.98); pointer-events:none;
    transform-origin:bottom right;
    transition:opacity .2s ease, transform .24s cubic-bezier(.2,.8,.2,1);
  }
  .chat.open{ opacity:1; transform:none; pointer-events:auto; }

  /* ---------- Header ---------- */
  .chat-header{
    display:flex; align-items:center; gap:12px; padding:14px 16px; flex:none;
    background:linear-gradient(135deg,#2f9bff,#1f6fff); color:#fff;
  }
  .avatar{
    width:40px; height:40px; border-radius:50%; flex:none; position:relative;
    background:rgba(255,255,255,.22); display:grid; place-items:center;
    font-weight:700; font-size:16px; letter-spacing:.02em;
    transition: background 0.3s;
  }
  .avatar.human-mode { background: var(--human-accent); }
  .avatar .dot{
    position:absolute; right:-1px; bottom:-1px; width:11px; height:11px; border-radius:50%;
    background:var(--green); border:2px solid #2b8cff;
  }
  .chat-title{ font-size:15px; font-weight:600; line-height:1.2; }
  .chat-sub{ font-size:12px; opacity:.85; margin-top:3px; }
  .header-actions{ margin-left:auto; display:flex; gap:4px; }
  .icon-btn{
    width:32px; height:32px; border-radius:8px; border:0; background:transparent;
    color:#fff; cursor:pointer; display:grid; place-items:center; opacity:.85; transition:.15s;
  }
  .icon-btn:hover{ background:rgba(255,255,255,.16); opacity:1; }
  .icon-btn svg{ width:18px; height:18px; }

  /* ---------- Messages ---------- */
  .messages{
    flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px;
    background:var(--bg); scroll-behavior:smooth;
  }
  .messages::-webkit-scrollbar{ width:6px; }
  .messages::-webkit-scrollbar-thumb{ background:#d4dbe6; border-radius:3px; }
  
  .msg{ display:flex; flex-direction:column; max-width:84%; animation:pop .18s ease; }
  @keyframes pop{ from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:none} }
  .msg.bot{ align-self:flex-start; }
  .msg.user{ align-self:flex-end; align-items:flex-end; }
  
  .msg .label{ font-size:11px; font-weight:600; color:var(--muted); margin-bottom:4px; padding:0 4px; }
  .msg.human .label { color: var(--human-accent); }
  
  .bubble{
    padding:10px 13px; border-radius:14px; font-size:14px; line-height:1.45;
    white-space:pre-wrap; word-break:break-word; overflow-wrap:anywhere;
  }
  .msg.bot .bubble{ background:#fff; border:1px solid var(--line); border-bottom-left-radius:5px; }
  .msg.human .bubble{ background:#fff5f5; border:1px solid #ffd4d4; border-bottom-left-radius:5px; }
  .msg.user .bubble{
    background:linear-gradient(135deg,var(--brand-light),var(--brand));
    color:#fff; border-bottom-right-radius:5px;
  }
  .msg .time{ font-size:11px; color:var(--muted); margin-top:4px; padding:0 4px; }

  /* typing */
  .typing .bubble{ display:flex; gap:4px; align-items:center; padding:14px; }
  .typing .bubble span{
    width:6px; height:6px; border-radius:50%; background:#b9c4d4; animation:bounce 1.2s infinite;
  }
  .typing .bubble span:nth-child(2){ animation-delay:.15s; }
  .typing .bubble span:nth-child(3){ animation-delay:.3s; }
  @keyframes bounce{ 0%,60%,100%{transform:translateY(0);opacity:.5} 30%{transform:translateY(-4px);opacity:1} }

  /* quick replies */
  .quick-wrap{ display:flex; flex-wrap:wrap; gap:8px; align-self:flex-start; max-width:100%; animation:pop .2s ease; }
  .chip{
    border:1px solid #cfe0f5; background:#fff; color:var(--brand);
    font-size:13px; padding:8px 13px; border-radius:999px; cursor:pointer;
    font-family:inherit; line-height:1.2; transition:.15s; text-align:left;
  }
  .chip:hover{ background:#eef5ff; border-color:#a8cbf5; }
  .chip.solid{
    background:linear-gradient(135deg,var(--brand-light),var(--brand));
    color:#fff; border-color:transparent; box-shadow:0 4px 12px rgba(31,111,255,.25);
  }
  .chip.solid:hover{ filter:brightness(1.05); }
  .chip.human-chip { background: var(--human-accent); color: white; border-color: transparent; }

  /* ---------- Composer ---------- */
  .composer{
    display:flex; align-items:center; gap:8px; padding:12px; flex:none;
    border-top:1px solid var(--line); background:#fff;
  }
  .composer input{
    flex:1; min-width:0; border:1px solid var(--line); background:#f7f9fc;
    border-radius:22px; padding:11px 16px; font-size:14px; outline:none;
    font-family:inherit; color:var(--ink); transition:.15s;
  }
  .composer input::placeholder{ color:#9aa7ba; }
  .composer input:focus{ border-color:#9fc6f5; background:#fff; box-shadow:0 0 0 3px rgba(31,111,255,.1); }
  .send{
    width:40px; height:40px; border-radius:50%; border:0; flex:none; cursor:pointer;
    background:linear-gradient(135deg,var(--brand-light),var(--brand)); color:#fff;
    display:grid; place-items:center; transition:.15s;
  }
  .send:hover{ transform:scale(1.06); }
  .send svg{ width:18px; height:18px; }

  /* ---------- Mobile ---------- */
  @media (max-width:480px){
    .chat{ right:0; bottom:0; width:100%; height:100%; height:100dvh; border-radius:0; border:0; }
    .launcher{ right:16px; bottom:16px; }
    .demo{ padding:48px 20px; }
    .demo h1{ font-size:22px; }
  }
</style>
</head>
<body>

<div class="demo">
  <h1>NLBBootstrap · Мероприятия</h1>
  <p>Демонстрационная страница. Чат-виджет — в правом нижнем углу.</p>
  <div class="hint">Нажмите <b>на круглую кнопку</b>, чтобы открыть чат</div>
</div>

<!-- ======================= LAUNCHER ======================= -->
<button class="launcher" id="launcher" aria-label="Открыть чат">
  <svg class="icon-chat" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
  </svg>
  <svg class="icon-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M18 6 6 18M6 6l12 12"/>
  </svg>
</button>

<!-- ======================= CHAT PANEL ======================= -->
<div class="chat" id="chat" role="dialog" aria-label="Чат поддержки">
  <header class="chat-header">
    <div class="avatar" id="avatar">
      N
      <span class="dot"></span>
    </div>
    <div>
      <div class="chat-title" id="chatTitle">ИИ-помощник НББ</div>
      <div class="chat-sub" id="chatSub">онлайн · отвечает мгновенно</div>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="minimize" aria-label="Свернуть" title="Свернуть">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg>
      </button>
      <button class="icon-btn" id="closeBtn" aria-label="Закрыть" title="Закрыть">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
  </header>

  <div class="messages" id="messages" aria-live="polite"></div>

  <form class="composer" id="composer" autocomplete="off">
    <input id="input" type="text" placeholder="Напишите сообщение…" aria-label="Сообщение">
    <button class="send" type="submit" aria-label="Отправить">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>
      </svg>
    </button>
  </form>
</div>

<script>
(() => {
  'use strict';

  /* ---------------- НАСТРОЙКИ ---------------- */
  // Установите true, чтобы подключить реальный Python-сервер (из предыдущего шага)
  const USE_REAL_AI = false; 
  const API_URL = 'http://localhost:8000/api/chat';

  /* ---------------- DOM ---------------- */
  const chat      = document.getElementById('chat');
  const launcher  = document.getElementById('launcher');
  const messages  = document.getElementById('messages');
  const form      = document.getElementById('composer');
  const input     = document.getElementById('input');
  const closeBtn  = document.getElementById('closeBtn');
  const minimize  = document.getElementById('minimize');
  const statusEl  = document.getElementById('chatSub');
  const titleEl   = document.getElementById('chatTitle');
  const avatarEl  = document.getElementById('avatar');

  /* ---------------- State ---------------- */
  let started = false;
  let mode    = 'bot';          // 'bot' | 'human'
  let typingEl = null;

  /* ================= Helpers ================= */
  const now = () => new Date().toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'});
  const scrollBottom = () => { messages.scrollTop = messages.scrollHeight; };
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];

  function addMessage(text, who = 'bot', opts = {}) {
    const row = document.createElement('div');
    row.className = 'msg ' + who;

    if (opts.label) {
      const l = document.createElement('div');
      l.className = 'label';
      l.textContent = opts.label;
      row.appendChild(l);
    }

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    if (opts.html) bubble.innerHTML = text;
    else bubble.textContent = text;
    row.appendChild(bubble);

    const t = document.createElement('div');
    t.className = 'time';
    t.textContent = now();
    row.appendChild(t);

    messages.appendChild(row);
    scrollBottom();
    return row;
  }

  function showTyping() {
    hideTyping();
    const row = document.createElement('div');
    row.className = 'msg ' + (mode === 'human' ? 'human' : 'bot') + ' typing';
    row.innerHTML = '<div class="bubble"><span></span><span></span><span></span></div>';
    messages.appendChild(row);
    typingEl = row;
    scrollBottom();
  }

  function hideTyping() {
    if (typingEl) { typingEl.remove(); typingEl = null; }
  }

  function botReply(text, delay = 700, cb) {
    showTyping();
    setTimeout(() => {
      hideTyping();
      addMessage(text, mode === 'human' ? 'human' : 'bot', mode === 'human' ? { label: 'Анна · оператор' } : {});
      if (cb) cb();
    }, delay);
  }

  function addQuickReplies(items) {
    const wrap = document.createElement('div');
    wrap.className = 'quick-wrap';
    items.forEach(item => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'chip' + (item.solid ? (item.human ? ' human-chip' : ' solid') : '');
      b.textContent = item.label;
      b.addEventListener('click', () => {
        wrap.remove();
        if (item.action) item.action();
        else sendUser(item.label);
      });
      wrap.appendChild(b);
    });
    messages.appendChild(wrap);
    scrollBottom();
  }

  function clearQuickReplies() {
    messages.querySelectorAll('.quick-wrap').forEach(n => n.remove());
  }

  /* ================= Отправка ================= */
  function sendUser(text) {
    text = (text || '').trim();
    if (!text) return;
    clearQuickReplies();
    addMessage(text, 'user');
    input.value = '';
    handleIncoming(text);
  }

  form.addEventListener('submit', e => {
    e.preventDefault();
    sendUser(input.value);
  });

  /* ================= Логика ИИ (Локальная заглушка) ================= */
  const RULES = [
    { re: /запис|регистрац|участи|билет|место|свободн/,
      a: 'Запись занимает минуту! 📝\nНапишите мне название события и ваше имя, и я оформлю заявку прямо здесь.' },
    { re: /событи|мероприят|афиш|расписан|лекци|встреч/,
      a: 'Ближайшие события:\n• 06.11 — Лекция «Современная проза»\n• 08.11 — Детский клуб «Совёнок»\n• 12.11 — Встреча с писателем\n\nПолная афиша: nlb.by/events' },
    { re: /адрес|находит|добрат|метро|куда/,
      a: 'Мы находимся по адресу: пр-т Независимости, 116 (Национальная библиотека Беларуси). Вход для посетителей со стороны парка.' },
    { re: /спасибо|благодар|понятно|окей/,
      a: 'Всегда рад помочь! 😊 Если появятся вопросы — пишите.' }
  ];

  const HUMAN_TRIGGER = /оператор|человек|менеджер|живой|позов|позват|соедин|жалоб|не понял/;
  const GREETING      = /привет|здравств|добрый|хай|hello|hi\b/;

  /* ================= Интеграция с бэкендом ================= */
  async function getAiResponse(text) {
    if (!USE_REAL_AI) return null; // Используем локальные правила
    
    try {
      const response = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ session_id: 'demo_123', message: text, history: [] })
      });
      const data = await response.json();
      return data.status === 'success' ? data.reply : null;
    } catch (e) {
      console.warn('AI Backend unavailable, falling back to local rules', e);
      return null;
    }
  }

  async function handleIncoming(text) {
    const t = text.toLowerCase().replace(/ё/g, 'е');

    // 1. Если уже говорим с человеком
    if (mode === 'human') { 
      operatorReply(text); 
      return; 
    }

    // 2. Триггер на перевод человеку
    if (HUMAN_TRIGGER.test(t)) { 
      switchToHuman(); 
      return; 
    }

    // 3. Попытка получить ответ от реального ИИ (Ollama)
    const aiResponse = await getAiResponse(text);
    if (aiResponse) {
      botReply(aiResponse, 800);
      return;
    }

    // 4. Локальная заглушка (правила)
    if (GREETING.test(t)) {
      botReply('Здравствуйте! 👋 Я ИИ-помощник библиотеки. Расскажите, какое мероприятие вас интересует, или выберите вариант ниже.', 500, () => {
        addQuickReplies([{ label: 'Как записаться?' }, { label: 'Адрес библиотеки' }, { label: 'Позвать оператора', solid: true, human: true, action: switchToHuman }]);
      });
      return;
    }

    const rule = RULES.find(r => r.re.test(t));
    if (rule) {
      botReply(rule.a, 700, () => {
        if (/событи|мероприят|афиш|запис/.test(t)) {
          addQuickReplies([{ label: 'Оформить запись' }, { label: 'Позвать оператора', solid: true, human: true, action: switchToHuman }]);
        }
      });
      return;
    }

    // 5. Не понял вопрос
    botReply('Хм, не уверен, что понял 🤔 Я помогаю с афишей, записью на события и адресом. Хотите, я позову живого оператора?', 900, () => {
      addQuickReplies([{ label: 'Да, позовите оператора', solid: true, human: true, action: switchToHuman }, { label: 'Нет, спасибо' }]);
    });
  }

  /* ================= Передача оператору ================= */
  function switchToHuman() {
    if (mode === 'human') return;
    mode = 'human';

    // Меняем визуал на "человеческий"
    titleEl.textContent = 'Анна';
    statusEl.textContent = 'оператор · печатает...';
    avatarEl.firstChild.nodeValue = 'А';
    avatarEl.classList.add('human-mode');

    addMessage('⏳ Соединяю вас с оператором...', 'bot');
    
    showTyping();
    setTimeout(() => {
      hideTyping();
      statusEl.textContent = 'онлайн';
      addMessage('Здравствуйте! Меня зовут Анна, я администратор библиотеки. Я вижу вашу переписку. Чем могу помочь? 👩‍💼', 'human', { label: 'Анна · оператор' });
    }, 2000);
  }

  function operatorReply(text) {
    const t = text.toLowerCase();
    let reply;

    if (/запис|регистрац|билет|место/.test(t)) {
      reply = 'Конечно, запишу вас! Напишите, пожалуйста, ваше имя и номер телефона, и я забронирую место.';
    } else if (/цен|стоим|сколько|руб/.test(t)) {
      reply = 'Секунду, уточню стоимость именно по вашему событию в системе...';
    } else {
      reply = pick(['Секунду, уточню информацию и вернусь к вам.', 'Да, конечно! Сейчас всё проверю в расписании.', 'Поняла вас, сейчас оформлю.']);
    }

    showTyping();
    setTimeout(() => {
      hideTyping();
      addMessage(reply, 'human', { label: 'Анна · оператор' });
    }, 1500 + Math.random() * 1000);
  }

  /* ================= Приветствие ================= */
  function greet() {
    addMessage('Здравствуйте! 👋 Я — ИИ-помощник Национальной библиотеки. Помогу найти событие или записаться на него.', 'bot');
    addQuickReplies([
      { label: 'Какие события скоро?' },
      { label: 'Как записаться?' },
      { label: 'Адрес и время работы' },
      { label: 'Позвать оператора', solid: true, human: true, action: switchToHuman }
    ]);
  }

  /* ================= Открытие / закрытие ================= */
  function openChat() {
    chat.classList.add('open');
    launcher.classList.add('active');
    if (!started) { started = true; greet(); }
    setTimeout(() => input.focus(), 220);
  }

  function closeChat() {
    chat.classList.remove('open');
    launcher.classList.remove('active');
  }

  launcher.addEventListener('click', () => chat.classList.contains('open') ? closeChat() : openChat());
  closeBtn.addEventListener('click', closeChat);
  minimize.addEventListener('click', closeChat);
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && chat.classList.contains('open')) closeChat(); });

})();
</script>
</body>
</html>
